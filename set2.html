<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <!-- ✅ Anti zoom iPhone -->
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
  <title>NEW</title>

  <style>
    :root{
      --bg:#0f172a; --card:#111827; --text:#e5e7eb; --muted:#94a3b8;
      --accent:#38bdf8; --danger:#334155; --stroke:#1f2937;
      --qbox:#0b1220;
      --accent2:#22c55e;
    }
    *{box-sizing:border-box}
    html,body{overscroll-behavior:none}

    body{
      margin:0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      background:var(--bg); color:var(--text);
      min-height:100vh; display:flex; align-items:center; justify-content:center;
      padding:16px;
    }
    .card{
      width:min(860px, 100%);
      background:var(--card);
      border:1px solid var(--stroke);
      border-radius:18px;
      padding:22px;
      box-shadow: 0 10px 35px rgba(0,0,0,.35);
    }

    .toprow{
      display:flex; align-items:flex-start; justify-content:space-between; gap:12px;
      margin-bottom:8px;
    }
    .title{font-size:26px; font-weight:800; margin:0}
    .sub{color:var(--muted); margin:0 0 16px; font-size:13px}

    .qbox{
      background:var(--qbox);
      border:1px solid var(--stroke);
      border-radius:14px;
      padding:18px;
      min-height:170px;
      display:flex;
      flex-direction:column;
      align-items:flex-start;
    }
    .qtext{font-size:20px; line-height:1.35; white-space:pre-wrap}

    /* ✅ gambar soal */
    .qimg{
      display:none;
      width:100%;
      max-height:280px;
      object-fit:contain;
      margin-top:14px;
      border-radius:14px;
      border:1px solid var(--stroke);
      background:#0b1220;
    }

    .barwrap{margin-top:16px}
    .barrow{display:flex; justify-content:space-between; align-items:center; gap:12px}
    .ptext{color:var(--muted); font-size:12px}
    progress{width:100%; height:14px; border-radius:999px; overflow:hidden}
    progress::-webkit-progress-bar{background:#0b1220}
    progress::-webkit-progress-value{background:var(--accent)}

    .btnrow{display:flex; gap:14px; margin-top:14px}

    /* ✅ tombol modern + anti zoom */
    button{
      flex:1;
      border:0;
      border-radius:16px;
      padding:18px;
      font-size:18px;
      font-weight:800;
      cursor:pointer;

      transition:.15s ease;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
      -webkit-user-select: none;
      user-select: none;
    }
    button:active{transform:scale(.99); opacity:.95}

    .btnTrue{background:var(--accent); color:#000}
    .btnFalse{background:var(--danger); color:var(--text)}

    .footerBtns{display:flex; gap:10px; margin-top:14px}
    .ghost{
      background:transparent;
      color:var(--muted);
      border:1px solid var(--stroke);
      font-weight:800;
      padding:14px;
      font-size:15px;
      border-radius:16px;
    }

    .back{
      background:var(--accent2);
      color:#000;
      border:0;
      padding:14px 16px;
      font-size:14px;
      border-radius:14px;
      white-space:nowrap;
      flex:0 0 auto;
    }

    /* =====================
       MODAL (FIX iPhone)
       ===================== */
    .modal{
      position:fixed; inset:0; display:none; align-items:center; justify-content:center;
      background:rgba(0,0,0,.6); padding:16px;
    }
    .modal .box{
      width:min(860px,100%);
      background:var(--card);
      border:1px solid var(--stroke);
      border-radius:18px;
      padding:16px;

      max-height: 88vh;
      display:flex;
      flex-direction:column;
    }
    .modal .content{
      margin-top:10px;
      background:var(--qbox);
      border:1px solid var(--stroke);
      border-radius:14px;
      padding:12px;
      overflow:auto;
      -webkit-overflow-scrolling: touch;
      flex:1;
    }
    .modal pre{
      white-space:pre-wrap; margin:0; font-family:inherit; line-height:1.35;
      font-size:14px;
    }
    .modal .actions{
      position: sticky;
      bottom: 0;
      background: var(--card);
      padding-top: 12px;
      margin-top: 12px;
      display:flex;
      gap:10px;
    }
  </style>
</head>

<body>
  <div class="card">
    <div class="toprow">
      <h1 class="title">NEW</h1>
      <button class="back" onclick="location.href='./index.html'">⬅ Menu</button>
    </div>

    <p class="sub" id="sub">Soal 1 dari 40 • No. Asli: 1</p>

    <div class="qbox">
      <div class="qtext" id="qtext"></div>
      <!-- ✅ slot gambar -->
      <img id="qimg" class="qimg" alt="" />
    </div>

    <div class="barwrap">
      <div class="barrow">
        <div class="ptext" id="ptext">Progress: 0%</div>
        <div class="ptext" id="scoretext">Salah: 0</div>
      </div>
      <progress id="prog" value="1" max="40"></progress>
    </div>

    <div class="btnrow" id="btnrow">
      <button class="btnTrue" id="btnTrue">✅ Benar</button>
      <button class="btnFalse" id="btnFalse">❌ Salah</button>
    </div>

    <div class="footerBtns">
      <button class="ghost" id="btnReset">Reset</button>
      <button class="ghost" id="btnFinish">Selesai & Lihat Hasil</button>
    </div>

      </div>

  <div class="modal" id="modal">
    <div class="box">
      <h2 style="margin:0; font-size:18px;">Hasil Ujian</h2>

      <div class="content">
        <pre id="result"></pre>
      </div>

      <div class="actions">
        <button class="btnTrue" id="btnClose">Tutup</button>
        <button class="ghost" id="btnMenu">⬅ Menu</button>
      </div>
    </div>
  </div>
<script>
  // ✅ wajib login dulu
  if (localStorage.getItem("shiken_logged_in") !== "1") {
    location.href = "./login.html";
  }
</script>

<script>
  // =====================
  // DATA SOAL (40) + JAWABAN
  // =====================
  const soal = [
    // Set 1 (1-20)
    "1. きんぞくをようせつすると、へんけいする。",
    "2. ひふくアークようせつは、フラックスをとそうしたようせつぼうをしようする。",
    "3. でんりゅうのたんいは、ワット（W）という。",
    "4. ひふくアークようせつそうちのめいしょうをきにゅうしました。ただしいでしょうか。",
    "5. ようせつしたぶぶんをきゅうにひやすと、ようせつしたきんぞくがやわらかくなる。",
    "6. すいぶんをふくんだようせつぼうでようせつすると、ブローホールがはっせいしやすくなる。",
    "7. ようせつぶのめいしょうをきにゅうしました。ただしいでしょうか。",
    "8. すみにくようせつぶのめいしょうをきにゅうしました。ただしいでしょうか。",
    "9. ずのようせつつぎては、エックスがたつぎてである。",
    "10. ようせつによるへんけいをふせぐために、こうそくジグをしようする。",
    "11. たかいようせつでんりゅうでようせつすると、アンダーカットができやすくなる。",
    "12. サブマージアークようせつはのうりつのたかいじどうようせつである。",
    "13. エックスせんけんさはようせつぶのないぶにはっせいするけっかんをはっけんしやすい。",
    "14. ようせつさぎょうふくはナイロンせいひんをしようする。",
    "15. ようせつさぎょうをするときはぼうじんマスクをしようする。",
    "16. ようせつさぎょうをするときはかわでさくせいしたほごてぶくろをしようする。",
    "17. ようせつぼうはあんぜんたいさくをしたホルダをしようする。",
    "18. さぎょうくつはスニーカーをしようする。",
    "19. ようせつさぎょうがおわったらようせつきのスイッチをきるひつようがある。",
    "20. たかいばしょでようせつさぎょうをするときはあんぜんぼうをしようするひつようがある。",

    // Set 2 (21-40)
    "21. きんぞくはようせつしても、へんけいしない。",
    "22. でんりゅうのたんいは、アンペアという。",
    "23. でんこうのたんいは、ボルトという。",
    "24. はんじどうようせつのビードのおきかたで、いっちょくせんにおくのを、ストリガービード（シングルビード）という。",
    "25. はんじどうようせつのビードのおきかたで、えんをえがくようにうんぼうして、はばひろくおくビードを、ウィービングビードという。",
    "26. ようせつしたぶぶんをきゅうにひやすと、ようせつしたきんぞくはかたくなる。",
    "27. ようせつそくどがおそいと、とけこみふりょうをおこしやすい。",
    "28. ようせつでんりゅうがちいさいと、とけこみふりょうがおこしやすい。",
    "29. ようせつさぎょうがしゅうりょうしたときは、さぎょうもれやまがりはてんけんしなくてもよい。",
    "30. ようせつによるへんけいをふせぐために、こうそくジグをしようする。",
    "31. たかいようせつでんりゅうでようせつすると、アンダーカットができやすい。",
    "32. ようせつそくどがはやすぎると、アンダーカットができやすい。",
    "33. ようせつそくどがおそすぎると、オーバーラップができやすい。",
    "34. ようせつでんりゅうがちいさいと、オーバーラップができやすい。",
    "35. ようせつさぎょうは、ナイロンせいのさぎょうふくをしようする。",
    "36. ようせつホルダーは、あんぜんたいさくをしたホルダーをしようする。",
    "37. さぎょうくつは、あんぜんぐつをりようする。",
    "38. ようせつさぎょうをはじめるまえに、しぎょうまえてんけんはしない。",
    "39. ようせつさぎょうをするときは、しゃこうほごがんきょうはしようしなくてもよい。",
    "40. ようせつぶのめいしょうをきにゅうしました。ただしいですか。"
  ];

  const jawaban = [
    // Set 1 (1-20)
    true,  true,  false, true,  false,
    true,  true,  true,  false,  true,
    true,  true,  true,  false, true,
    true,  true,  false, true,  true,

    // Set 2 (21-40)
    false, true,  false, true,  true,
    true,  true,  true,  false, true,
    true,  true,  true,  true,  false,
    true,  true,  false, false, true
  ];

  // ✅ mapping gambar sesuai nomor asli (4,7,8,9,40)
  // Taruh filenya di folder: /img
  const gambar = {
    4:  "img/q4.jpg",
    7:  "img/q7.jpg",
    8:  "img/q8.jpg",
    9:  "img/q9.jpg",
    40: "img/q40.jpg"
  };

  function shuffle(arr){
    for(let i=arr.length-1;i>0;i--){
      const j = Math.floor(Math.random()*(i+1));
      [arr[i],arr[j]]=[arr[j],arr[i]];
    }
  }

  // ✅ data ikut bawa img, jadi shuffle tetap aman
  let data = soal.map((s, i) => ({
    no_asli: i+1,
    soal: s,
    img: gambar[i+1] || null,
    kunci: jawaban[i]
  }));
  shuffle(data);

  let idx = 0;
  let salah = [];

  const qtext = document.getElementById("qtext");
  const qimg  = document.getElementById("qimg");
  const sub = document.getElementById("sub");
  const ptext = document.getElementById("ptext");
  const scoretext = document.getElementById("scoretext");
  const prog = document.getElementById("prog");
  const btnTrue = document.getElementById("btnTrue");
  const btnFalse = document.getElementById("btnFalse");
  const btnrow = document.getElementById("btnrow");

  const modal = document.getElementById("modal");
  const result = document.getElementById("result");
  const btnClose = document.getElementById("btnClose");
  const btnMenu = document.getElementById("btnMenu");
  const btnReset = document.getElementById("btnReset");
  const btnFinish = document.getElementById("btnFinish");

  prog.max = data.length;

  function acakPosisiTombol(){
    const items = [btnTrue, btnFalse];
    shuffle(items);
    btnrow.innerHTML = "";
    items.forEach(b => btnrow.appendChild(b));
  }

  function render(){
    const item = data[idx];
    qtext.textContent = item.soal;
    sub.textContent = `Soal ${idx+1} dari ${data.length} • No. Asli: ${item.no_asli}`;

    // ✅ tampilkan gambar jika ada
    if(item.img){
      qimg.src = item.img;
      qimg.style.display = "block";
      qimg.alt = `Gambar soal ${item.no_asli}`;
    } else {
      qimg.removeAttribute("src");
      qimg.style.display = "none";
      qimg.alt = "";
    }

    prog.value = idx + 1;
    const percent = Math.round(((idx+1)/data.length)*100);
    ptext.textContent = `Progress: ${percent}%`;
    scoretext.textContent = `Salah: ${salah.length}`;

    acakPosisiTombol();
  }

  function jawab(user){
    const item = data[idx];
    if(user !== item.kunci){
      salah.push({
        no: item.no_asli,
        soal: item.soal,
        jawaban: item.kunci ? "Benar" : "Salah"
      });
    }
    idx++;
    if(idx < data.length){
      render();
    } else {
      showHasil();
    }
  }

  function showHasil(){
    let teks = `Ujian selesai!\n\nSalah: ${salah.length} dari ${data.length}\n\n`;
    if(salah.length){
      teks += "Soal yang salah:\n\n";
      salah.sort((a,b)=>a.no-b.no).forEach(s=>{
        teks += `${s.no}. ${s.soal}\n   Jawaban benar: ${s.jawaban}\n\n`;
      });
    } else {
      teks += "🎉 Semua jawaban BENAR!";
    }

    result.textContent = teks;
    modal.style.display = "flex";

    const content = modal.querySelector(".content");
    if(content) content.scrollTop = 0;
    window.scrollTo(0, 0);
  }

  function resetAll(){
    data = soal.map((s, i) => ({
      no_asli: i+1,
      soal: s,
      img: gambar[i+1] || null,
      kunci: jawaban[i]
    }));
    shuffle(data);

    idx = 0;
    salah = [];
    modal.style.display = "none";
    render();
  }

  btnTrue.addEventListener("click", ()=>jawab(true));
  btnFalse.addEventListener("click", ()=>jawab(false));
  btnClose.addEventListener("click", ()=>modal.style.display="none");
  btnMenu.addEventListener("click", ()=>location.href="./index.html");
  btnReset.addEventListener("click", resetAll);
  btnFinish.addEventListener("click", showHasil);

  window.addEventListener("keydown", (e)=>{
    if(e.key === "b" || e.key === "B") jawab(true);
    if(e.key === "s" || e.key === "S") jawab(false);
    if(e.key === "Escape") showHasil();
  });

  render();
</script>
</body>
</html>
