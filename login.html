<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
  <title>Login SHIKEN</title>
  <style>
    :root{
      --bg:#0f172a; --card:#111827; --text:#e5e7eb; --muted:#94a3b8;
      --accent:#38bdf8; --stroke:#1f2937; --qbox:#0b1220;
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
      background:var(--bg); color:var(--text);
      min-height:100vh; display:flex; align-items:center; justify-content:center;
      padding:16px;
    }
    .card{
      width:min(480px,100%);
      background:var(--card);
      border:1px solid var(--stroke);
      border-radius:20px;
      padding:26px;
      box-shadow:0 10px 35px rgba(0,0,0,.35);
    }
    h1{margin:0 0 6px; font-size:26px; font-weight:900}
    .sub{margin:0 0 18px; color:var(--muted); font-size:13px}
    label{display:block; font-size:12px; color:var(--muted); margin:12px 0 6px}
    input{
      width:100%;
      padding:14px 14px;
      border-radius:14px;
      border:1px solid var(--stroke);
      background:var(--qbox);
      color:var(--text);
      font-size:16px; /* ✅ biar iPhone nggak zoom */
      outline:none;
    }
    input:focus{border-color:rgba(56,189,248,.6)}
    .row{display:flex; gap:10px; margin-top:16px}
    button{
      flex:1;
      border:0;
      border-radius:16px;
      padding:16px;
      font-size:16px;
      font-weight:900;
      cursor:pointer;
      touch-action:manipulation;
      -webkit-tap-highlight-color:transparent;
    }
    .btn{background:var(--accent); color:#000}
    .ghost{background:transparent; color:var(--muted); border:1px solid var(--stroke)}
    .err{margin-top:12px; color:#fca5a5; font-size:12px; min-height:16px}
    .hint{margin-top:10px; color:var(--muted); font-size:12px}
  </style>
</head>
<body>
  <div class="card">
    <h1>SHIKEN</h1>
    <p class="sub">Login dulu untuk masuk ke menu.</p>

    <label for="uid">ID</label>
    <input id="uid" type="text" autocomplete="username" inputmode="text" />

    <label for="pw">Password</label>
    <input id="pw" type="password" autocomplete="current-password" inputmode="text" />

    <div class="row">
      <button class="btn" id="btnLogin">Masuk</button>
      <button class="ghost" id="btnReset" type="button">Reset</button>
    </div>

    <div class="err" id="err"></div>
  </div>

<script>
  // ✅ ID & Password
  const VALID_ID = "miyagi";
  const VALID_PW = "miyagi";

  const uid = document.getElementById("uid");
  const pw  = document.getElementById("pw");
  const err = document.getElementById("err");

  function login(){
    err.textContent = "";
    const idv = (uid.value || "").trim();
    const pwv = (pw.value || "").trim();

    if(idv === VALID_ID && pwv === VALID_PW){
      localStorage.setItem("shiken_logged_in", "1");
      location.href = "./index.html";
    } else {
      err.textContent = "ID / Password salah.";
    }
  }

  document.getElementById("btnLogin").addEventListener("click", login);
  document.getElementById("btnReset").addEventListener("click", ()=>{
    uid.value=""; pw.value=""; err.textContent=""; uid.focus();
  });

  window.addEventListener("keydown", (e)=>{
    if(e.key === "Enter") login();
  });

  // kalau sudah login, langsung ke menu
  if(localStorage.getItem("shiken_logged_in") === "1"){
    location.href = "./index.html";
  }
</script>
</body>
</html>
