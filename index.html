<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <!-- ✅ ANTI ZOOM -->
  <meta name="viewport"
        content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />

  <title>Latihan Benar / Salah</title>

  <style>
    :root{
      --bg:#0f172a; --card:#111827; --text:#e5e7eb; --muted:#94a3b8;
      --accent:#38bdf8; --danger:#334155; --stroke:#1f2937;
      --qbox:#0b1220;
    }

    *{box-sizing:border-box}

    html,body{
      overscroll-behavior:none;
    }

    body{
      margin:0;
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
      background:var(--bg);
      color:var(--text);
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:16px;
    }

    .card{
      width:min(860px,100%);
      background:var(--card);
      border:1px solid var(--stroke);
      border-radius:18px;
      padding:22px;
      box-shadow:0 10px 35px rgba(0,0,0,.35);
    }

    .title{font-size:26px;font-weight:800;margin:0 0 6px}
    .sub{color:var(--muted);margin:0 0 16px;font-size:13px}

    .qbox{
      background:var(--qbox);
      border:1px solid var(--stroke);
      border-radius:14px;
      padding:18px;
      min-height:170px;
      display:flex;
      align-items:flex-start;
    }

    .qtext{
      font-size:20px;
      line-height:1.35;
      white-space:pre-wrap;
    }

    .barwrap{margin-top:16px}
    .barrow{
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:12px;
    }

    .ptext{color:var(--muted);font-size:12px}

    progress{
      width:100%;
      height:14px;
      border-radius:999px;
      overflow:hidden;
    }
    progress::-webkit-progress-bar{background:#0b1220}
    progress::-webkit-progress-value{background:var(--accent)}

    .btnrow{display:flex;gap:14px;margin-top:14px}

    /* ✅ Tombol anti zoom */
    button{
      flex:1;
      border:0;
      border-radius:14px;
      padding:14px 14px;
      font-size:16px; /* >=16px penting untuk iOS */
      font-weight:800;
      cursor:pointer;

      touch-action:manipulation;
      -webkit-tap-highlight-color:transparent;
      -webkit-user-select:none;
      user-select:none;
    }

    .btnTrue{background:var(--accent);color:var(--bg)}
    .btnFalse{background:var(--danger);color:var(--text)}

    .hint{margin-top:10px;color:var(--muted);font-size:12px}
    .footerBtns{display:flex;gap:10px;margin-top:14px}

    .ghost{
      background:transparent;
      color:var(--muted);
      border:1px solid var(--stroke);
      font-weight:700;
    }

    /* =====================
       MODAL FIX
       ===================== */
    .modal{
      position:fixed;
      inset:0;
      display:none;
      align-items:center;
      justify-content:center;
      background:rgba(0,0,0,.6);
      padding:16px;
    }

    .modal .box{
      width:min(860px,100%);
      background:var(--card);
      border:1px solid var(--stroke);
      border-radius:18px;
      padding:16px;
      max-height:88vh;
      display:flex;
      flex-direction:column;
    }

    .modal .content{
      margin-top:10px;
      background:var(--qbox);
      border:1px solid var(--stroke);
      border-radius:14px;
      padding:12px;
      overflow:auto;
      -webkit-overflow-scrolling:touch;
      flex:1;
    }

    .modal pre{
      white-space:pre-wrap;
      margin:0;
      font-family:inherit;
      line-height:1.35;
      font-size:14px;
    }

    .modal .actions{
      position:sticky;
      bottom:0;
      background:var(--card);
      padding-top:12px;
      margin-top:12px;
    }
  </style>
</head>
<body>
