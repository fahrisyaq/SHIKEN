<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8" />
<meta name="viewport"
content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
<title>SHIKEN MENU</title>

<style>
:root{
  --bg:#0f172a;
  --card:#111827;
  --text:#e5e7eb;
  --muted:#94a3b8;
  --accent:#38bdf8;
  --accent2:#22c55e;
  --stroke:#1f2937;
}
*{box-sizing:border-box}

body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial;
  background:var(--bg);
  color:var(--text);
  display:flex;
  justify-content:center;
  align-items:center;
  min-height:100vh;
  padding:16px;
}

.card{
  width:min(500px,100%);
  background:var(--card);
  border:1px solid var(--stroke);
  border-radius:20px;
  padding:30px;
  box-shadow:0 10px 35px rgba(0,0,0,.35);
  text-align:center;
}

h1{
  margin:0 0 25px;
  font-size:28px;
  letter-spacing:1px;
}

.menu{
  display:flex;
  flex-direction:column;
  gap:18px;
}

a.button{
  display:block;
  text-decoration:none;
  padding:18px;
  border-radius:16px;
  font-size:18px;
  font-weight:800;
  transition:.15s ease;
  touch-action:manipulation;
}

.btn1{
  background:var(--accent);
  color:#000;
}

.btn2{
  background:var(--accent2);
  color:#000;
}

a.button:hover{
  transform:translateY(-2px);
  opacity:.9;
}

.footer{
  margin-top:25px;
  font-size:12px;
  color:var(--muted);
}
</style>
</head>

<body>

<div class="card">
  <h1>SHIKEN</h1>

  <div class="menu">
    <!-- Pastikan nama file sesuai -->
    <a class="button btn1" href="./set1.html">H29_H25</a>
    <a class="button btn2" href="./set2.html">JS.b_JP</a>
  </div>

  <div class="footer">
    Pilih set untuk memulai latihan
  </div>
</div>

</body>
</html>
