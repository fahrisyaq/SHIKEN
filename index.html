<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
  <title>SHIKEN Menu</title>
  <style>
    :root{
      --bg:#0f172a; --card:#111827; --text:#e5e7eb; --muted:#94a3b8;
      --accent:#38bdf8; --stroke:#1f2937;
      --accent2:#22c55e;
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
      background:var(--bg); color:var(--text);
      min-height:100vh; display:flex; align-items:center; justify-content:center;
      padding:16px;
    }
    .card{
      width:min(860px,100%);
      background:var(--card);
      border:1px solid var(--stroke);
      border-radius:20px;
      padding:26px;
      box-shadow:0 10px 35px rgba(0,0,0,.35);
    }
    .top{
      display:flex; justify-content:space-between; align-items:flex-start; gap:12px;
      margin-bottom:14px;
    }
    h1{margin:0; font-size:28px; font-weight:900}
    .sub{margin:6px 0 0; color:var(--muted); font-size:13px}

    .grid{
      display:grid;
      grid-template-columns: repeat(2, minmax(0,1fr));
      gap:14px;
      margin-top:18px;
    }
    @media (max-width:720px){
      .grid{grid-template-columns:1fr}
    }

    a.btn{
      display:block;
      text-decoration:none;
      border-radius:18px;
      padding:18px;
      font-weight:900;
      font-size:18px;
      color:#000;
      background:var(--accent);
      transition:.15s ease;
      -webkit-tap-highlight-color:transparent;
      touch-action:manipulation;
    }
    a.btn:active{transform:scale(.99); opacity:.95}

    a.alt{background:var(--accent2)}
    .desc{margin-top:8px; color:rgba(0,0,0,.75); font-weight:700; font-size:13px}

    .logout{
      border:0;
      border-radius:14px;
      padding:12px 14px;
      font-size:14px;
      font-weight:900;
      background:transparent;
      color:var(--muted);
      border:1px solid var(--stroke);
      cursor:pointer;
      touch-action:manipulation;
      -webkit-tap-highlight-color:transparent;
      white-space:nowrap;
    }
    .logout:active{opacity:.9}
  </style>
</head>
<body>
  <div class="card">
    <div class="top">
      <div>
        <h1>SHIKEN</h1>
        <p class="sub">Pilih latihan yang mau dikerjakan.</p>
      </div>
      <button class="logout" id="btnLogout">Logout</button>
    </div>

    <div class="grid">
      <a class="btn alt" href="./set1.html">
        H29_H25
        <div class="desc">Latihan Benar/Salah (Set 1)</div>
      </a>

      <a class="btn" href="./set2.html">
        JS.b_JP
        <div class="desc">Latihan Benar/Salah (Set 2)</div>
      </a>
    </div>

    <p class="sub" style="margin-top:16px;">
      Tips: kalau link tidak jalan di iPhone, pastikan GitHub Pages sudah aktif & nama file benar.
    </p>
  </div>

<script>
  // ✅ wajib login dulu
  if(localStorage.getItem("shiken_logged_in") !== "1"){
    location.href = "./login.html";
  }

  // logout
  document.getElementById("btnLogout").addEventListener("click", ()=>{
    localStorage.removeItem("shiken_logged_in");
    location.href = "./login.html";
  });
</script>
</body>
</html>
