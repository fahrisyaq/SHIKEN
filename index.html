<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Latihan Benar / Salah</title>
  <style>
    :root{
      --bg:#0f172a; --card:#111827; --text:#e5e7eb; --muted:#94a3b8;
      --accent:#38bdf8; --danger:#334155; --stroke:#1f2937;
      --qbox:#0b1220;
    }
    *{box-sizing:border-box}
    body{
      margin:0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      background:var(--bg); color:var(--text);
      min-height:100vh; display:flex; align-items:center; justify-content:center;
      padding:16px;
    }
    .card{
      width:min(860px, 100%);
      background:var(--card);
      border:1px solid var(--stroke);
      border-radius:18px;
      padding:22px;
      box-shadow: 0 10px 35px rgba(0,0,0,.35);
    }
    .title{font-size:26px; font-weight:800; margin:0 0 6px}
    .sub{color:var(--muted); margin:0 0 16px; font-size:13px}
    .qbox{
      background:var(--qbox);
      border:1px solid var(--stroke);
      border-radius:14px;
      padding:18px;
      min-height:170px;
      display:flex; align-items:flex-start;
    }
    .qtext{font-size:20px; line-height:1.35; white-space:pre-wrap}
    .barwrap{margin-top:16px}
    .barrow{display:flex; justify-content:space-between; align-items:center; gap:12px}
    .ptext{color:var(--muted); font-size:12px}
    progress{width:100%; height:14px; border-radius:999px; overflow:hidden}
    progress::-webkit-progress-bar{background:#0b1220}
    progress::-webkit-progress-value{background:var(--accent)}
    .btnrow{display:flex; gap:14px; margin-top:14px}
    button{
      flex:1; border:0; border-radius:14px; padding:14px 14px;
      font-size:16px; font-weight:800; cursor:pointer;
    }
    .btnTrue{background:var(--accent); color:var(--bg)}
    .btnFalse{background:var(--danger); color:var(--text)}
    .hint{margin-top:10px; color:var(--muted); font-size:12px}
    .footerBtns{display:flex; gap:10px; margin-top:14px}
    .ghost{
      background:transparent; color:var(--muted); border:1px solid var(--stroke);
      font-weight:700;
    }
    .modal{
      position:fixed; inset:0; display:none; align-items:center; justify-content:center;
      background:rgba(0,0,0,.6); padding:16px;
    }
    .modal .box{
      width:min(860px,100%);
      background:var(--card); border:1px solid var(--stroke);
      border-radius:18px; padding:18px;
    }
    .modal pre{
      white-space:pre-wrap; margin:0; font-family:inherit; line-height:1.35;
      font-size:14px;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1 class="title">Latihan Benar / Salah</h1>
    <p class="sub" id="sub">Soal 1 dari 40 • No. Asli: 1</p>

    <div class="qbox">
      <div class="qtext" id="qtext"></div>
    </div>

    <div class="barwrap">
      <div class="barrow">
        <div class="ptext" id="ptext">Progress: 0%</div>
        <div class="ptext" id="scoretext">Salah: 0</div>
      </div>
      <progress id="prog" value="1" max="40"></progress>
    </div>

    <div class="btnrow" id="btnrow">
      <button class="btnTrue" id="btnTrue">✅ Benar</button>
      <button class="btnFalse" id="btnFalse">❌ Salah</button>
    </div>

    <div class="footerBtns">
      <button class="ghost" id="btnReset">Reset</button>
      <button class="ghost" id="btnFinish">Selesai & Lihat Hasil</button>
    </div>

    <div class="hint">Tips: di iPhone tinggal tap tombol. (Keyboard shortcut: B = Benar, S = Salah, Esc = selesai)</div>
  </div>

  <div class="modal" id="modal">
    <div class="box">
      <h2 style="margin:0 0 10px; font-size:18px;">Hasil Ujian</h2>
      <pre id="result"></pre>
      <div style="display:flex; gap:10px; margin-top:14px;">
        <button class="btnTrue" id="btnClose">Tutup</button>
      </div>
    </div>
  </div>

<script>
  // =====================
  // DATA SOAL (40) + JAWABAN
  // Benar=true, Salah=false
  // =====================
  const soal = [
    // Set 1 (1-20)
    "1. ようせつしても、へんけいしない。",
    "2. オーバラップとは、ビードとぼざいのあいだがとけたところである。",
    "3. でんあつのたんいは、ボルト［V］である。",
    "4. はんじどうアークようせつきをつかったマグようせつは、ようせつできるじょうけんにせっていすると、あんていしたさぎょうができる。",
    "5. フラックスいりワイヤをつかったマグようせつは、スパッタがおおい。",
    "6. アルゴン（Ar）ガスようきのいろは、ねずみいろである。",
    "7. ケーブルをながくしたほうが、でんりゅうがながれやすくなる。",
    "8. ぼざいとケーブルがゆるんでいても、アークはあんていする。",
    "9. ようせつワイヤをおくるロールに、あぶらやごみがついていても、そうじしない。",
    "10. ソリッドワイヤにはいっているマンガンやけいそは、ブローホールのはっせいをふせぐ。",
    "11. マグようせつようフラックスいりワイヤをつかうと、かぜがあってもさぎょうができる。",
    "12. マグようせつようワイヤは、さびていてももんだいがない。",
    "13. タックようせつは、ざいりょうをかりくみたてするもので、じゅんじょはかんがえなくてもよい。",
    "14. とけこみふりょうは、ルートかんかくがせまいとできる。",
    "15. とけこみふりょうがあると、ようせつぶはつよくなる。",
    "16. せまいところでようせつするときは、ひとりでする。",
    "17. ようせつするときは、てきせつなフィルタープレートをつかう。",
    "18. タックようせつ（かりづけようせつ）するときは、あしカバーやかわてぶくろをつかわない。",
    "19. あえんメッキされたざいりょうからはっせいしたヒュームをすうと、ねつがでたり、たおれたりすることがある。",
    "20. なつばは、はんそでのさぎょうふくでさぎょうする。",

    // Set 2 (21-40)
    "21. ブローホールは、スパッタがノズルにたくさんついていても、はっせいしない。",
    "22. はんじどうようせつは、トーチとワイヤがじどうてきにうごく。",
    "23. たんさんガスアークようせつでつかうたんさんガスは、とけたきんぞくをくうきにふれさせないためにつかう。",
    "24. でんりゅうのたんいは、ボルト（V）という。",
    "25. アンダカットは、ビードやぼざいとのきょうかいにできたみぞである。",
    "26. きんぞくのいたは、ようせつするとへんけいしやすい。",
    "27. タックようせつ（かりづけようせつ）は、どこにようせつしてもよい。",
    "28. ようせつワイヤは、きそくできめられたものをつかう。",
    "29. ペンキをぬったところをようせつしても、ブローホールははっせいしない。",
    "30. たかいばしょでようせつさぎょうをするときには、あんぜんぼうをかぶる。",
    "31. タックようせつは、ひっかんができないようにようせつする。",
    "32. たんさんガスはんじどうようせつそうちのなまえは3つともただしい。",
    "33. ずは、かどづけである。",
    "34. エックスせんけんさは、ようせつのないぶのアンダカットをみつけやすい。",
    "35. ようせつさぎょうをするときは、かわでつくったほごてぶくろをする。",
    "36. ようせつによるへんけいは、まもりがおおいほどちいさくなる。",
    "37. ようせつさぎょうをするときは、ぼうじんマスクをする。",
    "38. ようせつさぎょうがおわったあとで、ようせつぶのけんさをする。",
    "39. ずのかいさきは、エックスがたである。",
    "40. すみにくようせつをしたとき、bのほうがこわれやすい。"
  ];

  const jawaban = [
    // Set 1
    false,false,true,true,false,true,false,false,false,true,
    false,false,false,true,false,false,true,false,true,false,
    // Set 2
    false,false,true,false,true,true,false,true,false,true,
    true,true,false,false,true,false,true,true,false,true
  ];

  // =====================
  // HELPERS
  // =====================
  function shuffle(arr){
    for(let i=arr.length-1;i>0;i--){
      const j = Math.floor(Math.random()*(i+1));
      [arr[i],arr[j]]=[arr[j],arr[i]];
    }
  }

  // data = {no_asli, soal, kunci}
  let data = soal.map((s, i) => ({ no_asli: i+1, soal: s, kunci: jawaban[i] }));
  shuffle(data);

  let idx = 0;
  let salah = [];

  // =====================
  // UI ELEMENTS
  // =====================
  const qtext = document.getElementById("qtext");
  const sub = document.getElementById("sub");
  const ptext = document.getElementById("ptext");
  const scoretext = document.getElementById("scoretext");
  const prog = document.getElementById("prog");
  const btnTrue = document.getElementById("btnTrue");
  const btnFalse = document.getElementById("btnFalse");
  const btnrow = document.getElementById("btnrow");

  const modal = document.getElementById("modal");
  const result = document.getElementById("result");
  const btnClose = document.getElementById("btnClose");
  const btnReset = document.getElementById("btnReset");
  const btnFinish = document.getElementById("btnFinish");

  prog.max = data.length;

  function acakPosisiTombol(){
    // acak urutan tombol di DOM
    const items = [btnTrue, btnFalse];
    shuffle(items);
    btnrow.innerHTML = "";
    items.forEach(b => btnrow.appendChild(b));
  }

  function render(){
    const item = data[idx];
    qtext.textContent = item.soal;
    sub.textContent = `Soal ${idx+1} dari ${data.length} • No. Asli: ${item.no_asli}`;

    prog.value = idx + 1;
    const percent = Math.round(((idx+1)/data.length)*100);
    ptext.textContent = `Progress: ${percent}%`;
    scoretext.textContent = `Salah: ${salah.length}`;

    acakPosisiTombol();
  }

  function jawab(user){
    const item = data[idx];
    if(user !== item.kunci){
      salah.push({
        no: item.no_asli,
        soal: item.soal,
        jawaban: item.kunci ? "Benar" : "Salah"
      });
    }
    idx++;
    if(idx < data.length){
      render();
    } else {
      showHasil();
    }
  }

  function showHasil(){
    let teks = `Ujian selesai!\n\nSalah: ${salah.length} dari ${data.length}\n\n`;
    if(salah.length){
      teks += "Soal yang salah:\n\n";
      salah.sort((a,b)=>a.no-b.no).forEach(s=>{
        teks += `${s.no}. ${s.soal}\n   Jawaban benar: ${s.jawaban}\n\n`;
      });
    } else {
      teks += "🎉 Semua jawaban BENAR!";
    }
    result.textContent = teks;
    modal.style.display = "flex";
  }

  function resetAll(){
    data = soal.map((s, i) => ({ no_asli: i+1, soal: s, kunci: jawaban[i] }));
    shuffle(data);
    idx = 0;
    salah = [];
    modal.style.display = "none";
    render();
  }

  // events
  btnTrue.addEventListener("click", ()=>jawab(true));
  btnFalse.addEventListener("click", ()=>jawab(false));
  btnClose.addEventListener("click", ()=>modal.style.display="none");
  btnReset.addEventListener("click", resetAll);
  btnFinish.addEventListener("click", showHasil);

  // keyboard (kalau dibuka di laptop juga enak)
  window.addEventListener("keydown", (e)=>{
    if(e.key === "b" || e.key === "B") jawab(true);
    if(e.key === "s" || e.key === "S") jawab(false);
    if(e.key === "Escape") showHasil();
  });

  // start
  render();
</script>
</body>
</html>
