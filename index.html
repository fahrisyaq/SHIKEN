<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport"
        content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
  <title>Latihan Benar / Salah</title>

  <style>
    :root{
      --bg:#0f172a; --card:#111827; --text:#e5e7eb; --muted:#94a3b8;
      --accent:#38bdf8; --danger:#334155; --stroke:#1f2937;
      --qbox:#0b1220;
    }
    *{box-sizing:border-box}
    html,body{overscroll-behavior:none}

    body{
      margin:0;
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
      background:var(--bg);
      color:var(--text);
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:16px;
    }

    .card{
      width:min(860px,100%);
      background:var(--card);
      border:1px solid var(--stroke);
      border-radius:18px;
      padding:22px;
      box-shadow:0 10px 35px rgba(0,0,0,.35);
    }

    .title{font-size:26px;font-weight:800;margin:0 0 6px}
    .sub{color:var(--muted);margin:0 0 16px;font-size:13px}

    .qbox{
      background:var(--qbox);
      border:1px solid var(--stroke);
      border-radius:14px;
      padding:18px;
      min-height:170px;
    }
    .qtext{font-size:20px;line-height:1.35;white-space:pre-wrap}

    .barwrap{margin-top:16px}
    .barrow{display:flex;justify-content:space-between;align-items:center}
    .ptext{color:var(--muted);font-size:12px}

    progress{width:100%;height:14px;border-radius:999px}
    progress::-webkit-progress-bar{background:#0b1220}
    progress::-webkit-progress-value{background:var(--accent)}

    .btnrow{display:flex;gap:14px;margin-top:14px}
    button{
      flex:1;
      border:0;
      border-radius:14px;
      padding:14px;
      font-size:16px;
      font-weight:800;
      cursor:pointer;
      touch-action:manipulation;
      -webkit-tap-highlight-color:transparent;
      user-select:none;
    }
    .btnTrue{background:var(--accent);color:var(--bg)}
    .btnFalse{background:var(--danger);color:var(--text)}

    .footerBtns{display:flex;gap:10px;margin-top:14px}
    .ghost{
      background:transparent;
      color:var(--muted);
      border:1px solid var(--stroke);
      font-weight:700;
    }

    /* MODAL HASIL */
    .modal{
      position:fixed;inset:0;
      display:none;
      align-items:center;
      justify-content:center;
      background:rgba(0,0,0,.6);
      padding:16px;
    }
    .modal .box{
      width:min(860px,100%);
      background:var(--card);
      border:1px solid var(--stroke);
      border-radius:18px;
      padding:16px;
      max-height:88vh;
      display:flex;
      flex-direction:column;
    }
    .modal .content{
      margin-top:10px;
      background:var(--qbox);
      border:1px solid var(--stroke);
      border-radius:14px;
      padding:12px;
      overflow:auto;
      flex:1;
    }
    .modal pre{
      margin:0;
      white-space:pre-wrap;
      font-family:inherit;
      font-size:14px;
      line-height:1.35;
    }
    .modal .actions{margin-top:12px}
  </style>
</head>

<body>
<div class="card">
  <h1 class="title">Latihan Benar / Salah</h1>
  <p class="sub" id="sub"></p>

  <div class="qbox">
    <div class="qtext" id="qtext"></div>
  </div>

  <div class="barwrap">
    <div class="barrow">
      <div class="ptext" id="ptext"></div>
      <div class="ptext" id="scoretext"></div>
    </div>
    <progress id="prog"></progress>
  </div>

  <div class="btnrow" id="btnrow">
    <button class="btnTrue" id="btnTrue">✅ Benar</button>
    <button class="btnFalse" id="btnFalse">❌ Salah</button>
  </div>

  <div class="footerBtns">
    <button class="ghost" id="btnReset">Reset</button>
    <button class="ghost" id="btnFinish">Selesai</button>
  </div>
</div>

<div class="modal" id="modal">
  <div class="box">
    <h2>Hasil Ujian</h2>
    <div class="content">
      <pre id="result"></pre>
    </div>
    <div class="actions">
      <button class="btnTrue" id="btnClose">Tutup</button>
    </div>
  </div>
</div>

<script>
const soal = [
  "1. ようせつしても、へんけいしない。",
  "2. オーバラップとは、ビードとぼざいのあいだがとけたところである。",
  "3. でんあつのたんいは、ボルト［V］である。",
  "4. はんじどうアークようせつきをつかったマグようせつは、ようせつできるじょうけんにせっていすると、あんていしたさぎょうができる。",
  "5. フラックスいりワイヤをつかったマグようせつは、スパッタがおおい。",
  "6. アルゴン（Ar）ガスようきのいろは、ねずみいろである。",
  "7. ケーブルをながくしたほうが、でんりゅうがながれやすくなる。",
  "8. ぼざいとケーブルがゆるんでいても、アークはあんていする。",
  "9. ようせつワイヤをおくるロールに、あぶらやごみがついていても、そうじしない。",
  "10. ソリッドワイヤにはいっているマンガンやけいそは、ブローホールのはっせいをふせぐ。",
  "11. マグようせつようフラックスいりワイヤをつかうと、かぜがあってもさぎょうができる。",
  "12. マグようせつようワイヤは、さびていてももんだいがない。",
  "13. タックようせつは、ざいりょうをかりくみたてするもので、じゅんじょはかんがえなくてもよい。",
  "14. とけこみふりょうは、ルートかんかくがせまいとできる。",
  "15. とけこみふりょうがあると、ようせつぶはつよくなる。",
  "16. せまいところでようせつするときは、ひとりでする。",
  "17. ようせつするときは、てきせつなフィルタープレートをつかう。",
  "18. タックようせつ（かりづけようせつ）するときは、あしカバーやかわてぶくろをつかわない。",
  "19. あえんメッキされたざいりょうからはっせいしたヒュームをすうと、ねつがでたり、たおれたりすることがある。",
  "20. なつばは、はんそでのさぎょうふくでさぎょうする。",
  "21. ブローホールは、スパッタがノズルにたくさんついていても、はっせいしない。",
  "22. はんじどうようせつは、トーチとワイヤがじどうてきにうごく。",
  "23. たんさんガスアークようせつでつかうたんさんガスは、とけたきんぞくをくうきにふれさせないためにつかう。",
  "24. でんりゅうのたんいは、ボルト（V）という。",
  "25. アンダカットは、ビードやぼざいとのきょうかいにできたみぞである。",
  "26. きんぞくのいたは、ようせつするとへんけいしやすい。",
  "27. タックようせつ（かりづけようせつ）は、どこにようせつしてもよい。",
  "28. ようせつワイヤは、きそくできめられたものをつかう。",
  "29. ペンキをぬったところをようせつしても、ブローホールははっせいしない。",
  "30. たかいばしょでようせつさぎょうをするときには、あんぜんぼうをかぶる。",
  "31. タックようせつは、ひっかんができないようにようせつする。",
  "32. たんさんガスはんじどうようせつそうちのなまえは3つともただしい。",
  "33. ずは、かどづけである。",
  "34. エックスせんけんさは、ようせつのないぶのアンダカットをみつけやすい。",
  "35. ようせつさぎょうをするときは、かわでつくったほごてぶくろをする。",
  "36. ようせつによるへんけいは、まもりがおおいほどちいさくなる。",
  "37. ようせつさぎょうをするときは、ぼうじんマスクをする。",
  "38. ようせつさぎょうがおわったあとで、ようせつぶのけんさをする。",
  "39. ずのかいさきは、エックスがたである。",
  "40. すみにくようせつをしたとき、bのほうがこわれやすい。"
];

const jawaban = [
  false,false,true,true,false,true,false,false,false,true,
  false,false,false,true,false,false,true,false,true,false,
  false,false,true,false,true,true,false,true,false,true,
  true,true,false,false,true,false,true,true,false,true
];

function shuffle(a){
  for(let i=a.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
}

let data = soal.map((s,i)=>({no:i+1,soal:s,kunci:jawaban[i]}));
shuffle(data);

let idx=0, salah=[];

const qtext=qtextEl=document.getElementById("qtext");
const sub=subEl=document.getElementById("sub");
const ptext=ptextEl=document.getElementById("ptext");
const scoretext=scoretextEl=document.getElementById("scoretext");
const prog=document.getElementById("prog");
const modal=document.getElementById("modal");
const result=document.getElementById("result");

prog.max=data.length;

function acak(){
  const row=document.getElementById("btnrow");
  const btns=[btnTrue,btnFalse];
  shuffle(btns);
  row.innerHTML="";
  btns.forEach(b=>row.appendChild(b));
}

function render(){
  const it=data[idx];
  qtext.textContent=it.soal;
  sub.textContent=`Soal ${idx+1} dari ${data.length}`;
  prog.value=idx+1;
  ptext.textContent=`Progress ${Math.round((idx+1)/data.length*100)}%`;
  scoretext.textContent=`Salah: ${salah.length}`;
  acak();
}

function jawab(v){
  const it=data[idx];
  if(v!==it.kunci) salah.push(it);
  idx++;
  idx<data.length ? render() : showHasil();
}

function showHasil(){
  let t=`Ujian selesai\n\nSalah: ${salah.length} dari ${data.length}\n\n`;
  salah.forEach(s=>{
    t+=`${s.no}. ${s.soal}\nJawaban benar: ${s.kunci?"Benar":"Salah"}\n\n`;
  });
  if(!salah.length) t+="🎉 Semua jawaban BENAR!";
  result.textContent=t;
  modal.style.display="flex";
  window.scrollTo(0,0);
}

btnTrue.onclick=()=>jawab(true);
btnFalse.onclick=()=>jawab(false);
btnClose.onclick=()=>modal.style.display="none";
btnReset.onclick=()=>location.reload();
btnFinish.onclick=showHasil;

render();
</script>
</body>
</html>
